trigger:
  branches:
    include:
    - main
  tags:
    include:
    - v*

pr: none

schedules:
- cron: '0 6 * * *'
  displayName: 'Daily full UI test run'
  branches:
    include:
    - main
  always: true

pool:
  vmImage: 'windows-latest'

variables:
  solution: 'OSDP-Bench.sln'
  buildConfiguration: 'Release'

stages:
  - stage: Build
    displayName: 'Build, Test, and Inspect'
    jobs:
      - job: build
        displayName: 'Build, Test, and Inspect'
        steps:
          - checkout: self
            submodules: true
          - template: build.yml

  - stage: Test
    displayName: 'UI Tests'
    dependsOn: Build
    jobs:
      - job: ui_tests_smoke
        displayName: 'UI Smoke Tests'
        continueOnError: true
        steps:
          - checkout: self
            submodules: true
          - template: ui-tests-smoke.yml

      - job: ui_tests_full
        displayName: 'UI Tests (Full)'
        condition: or(eq(variables['Build.Reason'], 'Schedule'), eq(variables['Build.Reason'], 'Manual'), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
        continueOnError: true
        steps:
          - checkout: self
            submodules: true
          - template: ui-tests.yml

  - stage: Package
    displayName: 'Package and Publish'
    dependsOn: Build
    condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
    jobs:
      - job: package
        displayName: 'Package and Publish'
        steps:
          - checkout: self
            submodules: true
            persistCredentials: true
            clean: true
          - template: package.yml
