trigger:
  branches:
    include:
    - main
  tags:
    include:
    - v*

pr: none

schedules:
- cron: '0 6 * * *'
  displayName: 'Daily full UI test run'
  branches:
    include:
    - main
  always: true

pool:
  vmImage: 'windows-latest'

variables:
  solution: 'OSDP-Bench.sln'
  buildConfiguration: 'Release'

jobs:
  - job: build
    displayName: 'Build, Test, and Inspect'
    pool:
      vmImage: 'windows-latest'
    steps:
      - checkout: self
        submodules: true
      - template: build.yml

  - job: ui_tests
    displayName: 'UI Smoke Tests'
    pool:
      vmImage: 'windows-latest'
    dependsOn:
      build
    continueOnError: true
    steps:
      - checkout: self
        submodules: true
      - template: ui-tests-smoke.yml

  - job: ui_tests_full
    displayName: 'UI Tests (Full)'
    condition: or(eq(variables['Build.Reason'], 'Schedule'), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
    pool:
      vmImage: 'windows-latest'
    dependsOn:
      build
    continueOnError: true
    steps:
      - checkout: self
        submodules: true
      - template: ui-tests.yml

  - job: package
    displayName: 'Package and Publish'
    condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
    pool:
      vmImage: 'windows-latest'
    dependsOn:
      build
    steps:
      - checkout: self
        submodules: true
        persistCredentials: true
        clean: true
      - template: package.yml
